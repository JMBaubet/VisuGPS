<svg width="360" height="600" viewBox="0 0 360 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="360" height="600" fill="#121212" />
  
  <!-- Content Area (Centered) -->
  <g transform="translate(180, 250)">
    <!-- Logo VisuGPS (Simplified Neon Version) - Large -->
    <g transform="translate(-50, -120)">
        <rect width="100" height="100" rx="20" fill="#1E1E1E" />
        <defs>
          <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#F44336;stop-opacity:1" />
          </linearGradient>
        </defs>
        <path d="M10,45 C10,45 15,30 20,35 C25,40 30,20 35,25 C40,30 50,45 50,45" fill="none" stroke="url(#neonGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" transform="translate(15, 15) scale(1.5)" />
        <circle cx="42" cy="38" r="5" fill="none" stroke="#F44336" stroke-width="3" transform="translate(15, 15) scale(1.5)" />
    </g>

    <text y="20" font-family="Roboto, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">VisuGPS</text>
    <text y="60" font-family="Roboto, sans-serif" font-size="18" fill="#B0BEC5" text-anchor="middle">Connexion en cours...</text>
    
    <!-- Spinner Placeholder -->
    <g transform="translate(-20, 100)">
        <circle cx="20" cy="20" r="18" fill="none" stroke="#333" stroke-width="4" />
        <path d="M20,2 A18,18 0 0,1 38,20" fill="none" stroke="#1976D2" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>
</svg>
