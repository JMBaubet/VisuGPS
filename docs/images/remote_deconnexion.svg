            <g transform="translate(25, 0)">
                <rect width="40" height="20" rx="10" fill="#1976D2" />
                <circle cx="30" cy="10" r="8" fill="white" />
            </g>
            <!-- mdi-white-balance-sunny -->
            <g transform="translate(70, 0)">
                <path d="M3.55 19.09L4.96 20.5L6.76 18.71L5.34 17.29M12 6C8.69 6 6 8.69 6 12S8.69 18 12 18 18 15.31 18 12C18 8.68 15.31 6 12 6M20 13H23V11H20M17.24 18.71L19.04 20.5L20.45 19.09L18.66 17.29M20.45 5L19.04 3.6L17.24 5.39L18.66 6.81M13 1H11V4H13M6.76 5.39L4.96 3.6L3.55 5L5.34 6.81L6.76 5.39M1 13H4V11H1M13 20H11V23H13" fill="#FBC02D" />
            </g>
        </g>
    </g>
  </g>

  <!-- Content Area (Centered) -->
  <g transform="translate(16, 150)">
    <!-- Status Card (tonal style) -->
    <rect width="328" height="80" rx="4" fill="#333" fill-opacity="0.2" />
    <text x="164" y="45" font-family="Roboto, sans-serif" font-size="20" font-weight="bold" fill="#B0BEC5" text-anchor="middle">Déconnecté par le serveur</text>
    
    <!-- Connect Button Row -->
    <g transform="translate(0, 90)">
      <rect width="328" height="48" rx="4" fill="#1976D2" />
      <g transform="translate(85, 12)">
