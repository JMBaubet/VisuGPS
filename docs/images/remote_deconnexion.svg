        <path d="M12,3C17.5,3 22.2,5.2 25.6,8.7L23.8,10.5C21,7.7 17.2,6 13,6C8.8,6 5,7.7 2.2,10.5L0.4,8.7C3.8,5.2 8.5,3 14,3M12,9C15.1,9 18,10.2 20.2,12.2L18.4,14C16.8,12.7 14.8,12 12.6,12C10.4,12 8.4,12.7 6.8,14L5,12.2C7.2,10.2 10.1,9 13.2,9M12,15C13.6,15 15.1,15.6 16.2,16.7L12.6,20.3L9,16.7C10.1,15.6 11.6,15 13.2,15Z" fill="white" transform="scale(1.2)" />
        <text x="100" y="18" font-family="Roboto, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">CONNEXION</text>
      </g>
    </g>
  </g>
</svg>
