<svg width="360" height="600" viewBox="0 0 360 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="360" height="600" fill="#121212" />
  
  <!-- Header Row (Matches remote_accueil.svg) -->
  <g transform="translate(16, 20)">
    <!-- Logo VisuGPS (Simplified Neon Version) -->
    <rect width="80" height="80" rx="16" fill="#1E1E1E" />
    <defs>
      <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#F44336;stop-opacity:1" />
      </linearGradient>
    </defs>
    <path d="M10,45 C10,45 15,30 20,35 C25,40 30,20 35,25 C40,30 50,45 50,45" fill="none" stroke="url(#neonGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(5, 5) scale(1.3)" />
    <circle cx="42" cy="38" r="5" fill="none" stroke="#F44336" stroke-width="2" transform="translate(5, 5) scale(1.3)" />
    
    <!-- Title and Switch Area -->
    <g transform="translate(100, 0)">
        <text x="122" y="32" font-family="Roboto, sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">VisuGPS</text>
        
        <!-- Theme Switch row -->
        <g transform="translate(70, 45)">
            <!-- mdi-weather-night -->
            <path d="M17.75,4.09L15.22,6.03L16.13,9.09L13.5,7.28L10.87,9.09L11.78,6.03L9.25,4.09L12.44,4L13.5,1L14.56,4L17.75,4.09M21.25,11L19.61,12.25L20.2,14.23L18.5,13.06L16.8,14.23L17.39,12.25L15.75,11L17.81,10.95L18.5,9L19.19,10.95L21.25,11M18.97,15.95C19.8,15.87 20.69,17.05 20.16,17.8C19.84,18.25 19.5,18.67 19.08,19.07C15.17,23 8.84,23 4.94,19.07C1.03,15.17 1.03,8.83 4.94,4.93C5.34,4.53 5.76,4.17 6.21,3.85C6.96,3.32 8.14,4.21 8.06,5.04C7.79,7.9 8.75,10.87 10.95,13.06C13.14,15.26 16.1,16.22 18.97,15.95M17.33,17.97C14.5,17.81 11.7,16.64 9.53,14.5C7.36,12.31 6.2,9.5 6.04,6.68C3.23,9.82 3.34,14.64 6.35,17.66C9.37,20.67 14.19,20.78 17.33,17.97Z" fill="#B0BEC5" transform="scale(0.8)"/>
            <g transform="translate(25, 0)">
                <rect width="40" height="20" rx="10" fill="#1976D2" />
                <circle cx="30" cy="10" r="8" fill="white" />
            </g>
            <!-- mdi-white-balance-sunny -->
            <g transform="translate(70, 0)">
                <path d="M3.55 19.09L4.96 20.5L6.76 18.71L5.34 17.29M12 6C8.69 6 6 8.69 6 12S8.69 18 12 18 18 15.31 18 12C18 8.68 15.31 6 12 6M20 13H23V11H20M17.24 18.71L19.04 20.5L20.45 19.09L18.66 17.29M20.45 5L19.04 3.6L17.24 5.39L18.66 6.81M13 1H11V4H13M6.76 5.39L4.96 3.6L3.55 5L5.34 6.81L6.76 5.39M1 13H4V11H1M13 20H11V23H13" fill="#FBC02D" />
            </g>
        </g>
    </g>
  </g>

  <!-- Content Area (Centered) -->
  <g transform="translate(16, 150)">
    <!-- Status Card (tonal error style) -->
    <rect width="328" height="90" rx="4" fill="#661919" fill-opacity="0.2" /> <!-- Slightly increased height for larger text -->
    <text x="164" y="40" font-family="Roboto, sans-serif" font-size="24" font-weight="bold" fill="#FF5252" text-anchor="middle">Couplage refusé</text>
    <text x="164" y="70" font-family="Roboto, sans-serif" font-size="12" fill="#FF8A80" text-anchor="middle">Cet appareil a été bloqué.</text>
    
    <!-- Disconnect Button Row -->
    <g transform="translate(0, 110)">
        <rect width="328" height="40" rx="4" fill="none" stroke="#FF5252" stroke-width="1" />
        <g transform="translate(85, 8)">
            <!-- mdi-power -->
            <path d="M16.56,5.44L15.11,6.89C16.84,7.94 18,9.83 18,12A6,6 0 0,1 12,18A6,6 0 0,1 6,12C6,9.83 7.16,7.94 8.88,6.88L7.44,5.44C5.36,6.88 4,9.28 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12C20,9.28 18.64,6.88 16.56,5.44M13,3H11V13H13" fill="#FF5252" />
            <text x="30" y="17" font-family="Roboto, sans-serif" font-size="14" font-weight="bold" fill="#FF5252">DÉCONNEXION</text>
        </g>
    </g>
  </g>
</svg>
