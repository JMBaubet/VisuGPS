<svg width="360" height="600" viewBox="0 0 360 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="360" height="600" fill="#121212" />
  
  <!-- Header Row -->
  <g transform="translate(16, 20)">
    <!-- Logo VisuGPS (Simplified Neon Version) -->
    <rect width="60" height="60" rx="12" fill="#1E1E1E" />
    <defs>
      <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:#FF9800;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#F44336;stop-opacity:1" />
      </linearGradient>
    </defs>
    <path d="M10,45 C10,45 15,30 20,35 C25,40 30,20 35,25 C40,30 50,45 50,45" fill="none" stroke="url(#neonGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(5, 5)"/>
    <circle cx="42" cy="38" r="5" fill="none" stroke="#F44336" stroke-width="2" transform="translate(5, 5)"/>
    
    <text x="75" y="40" font-family="Roboto, sans-serif" font-size="28" font-weight="bold" fill="white">VisuGPS</text>
  </g>

  <!-- Pairing Content -->
  <g transform="translate(0, 150)">
    <text x="180" y="0" font-family="Roboto, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">COUPLAGE</text>
    <text x="180" y="35" font-family="Roboto, sans-serif" font-size="16" fill="#B0BEC5" text-anchor="middle">Scannez le QR Code sur votre PC</text>
    
    <!-- QR Code Placeholder -->
    <rect x="80" y="80" width="200" height="200" rx="8" fill="white" />
    <g transform="translate(100, 100)">
        <!-- Simplified QR Pattern -->
        <rect x="0" y="0" width="40" height="40" fill="#121212" />
        <rect x="5" y="5" width="30" height="30" fill="white" />
        <rect x="10" y="10" width="20" height="20" fill="#121212" />
        
        <rect x="120" y="0" width="40" height="40" fill="#121212" />
        <rect x="125" y="5" width="30" height="30" fill="white" />
        <rect x="130" y="10" width="20" height="20" fill="#121212" />
        
        <rect x="0" y="120" width="40" height="40" fill="#121212" />
        <rect x="5" y="125" width="30" height="30" fill="white" />
        <rect x="10" y="130" width="20" height="20" fill="#121212" />
        
        <!-- Random dots -->
        <rect x="60" y="20" width="20" height="20" fill="#121212" />
        <rect x="100" y="60" width="40" height="20" fill="#121212" />
        <rect x="40" y="100" width="20" height="40" fill="#121212" />
        <rect x="80" y="140" width="60" height="20" fill="#121212" />
    </g>

    <!-- Cancel Button -->
    <g transform="translate(16, 380)">
        <rect width="328" height="40" rx="4" fill="none" stroke="#666" stroke-width="1" />
        <text x="164" y="25" font-family="Roboto, sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">ANNULER</text>
    </g>
  </g>
</svg>
